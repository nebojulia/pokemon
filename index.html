<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <title>Document</title>
    <script src="./js/main.js"></script>
</head>
<body>
    <div class="container">
        <div class="tabs" id="tabs">
            <img class="burger" id="burger" src="./img/svg/icon__filter-button.svg" alt="filter button">
            <div class="header-wrap">
                <div class="tabs__header">
                    <button class="tabs__trigger">Pockemons</button>
                    <button class="tabs__trigger">Fight</button>
                </div>
            </div>
            <div class="tabs__body">
                <div>
                    <div class="tabs__content">
                        <div class="filter" id="filter">
                            <div class="filter__header">
                                <span class="filter__title">Per page</span>
                                <div class="perPage-buttons">
                                    <button class="perPage-button">12</button>
                                    <button class="perPage-button">24</button>
                                    <button class="perPage-button">48</button>
                                </div>
                            </div>
                            <div class="filter__body">
                                <div class="filter__button">
                                    <div  class="filter__button-title">
                                        <img class="filter__button-svg" src="./img/svg/icon__type--all.svg" alt="all">
                                        <span class="filter__button-name">All</span>
                                    </div>
                                    <div class="filter__button-info">
                                        809
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="grid">

                        </div>
                    </div>
                    <div class="tabs__content"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
